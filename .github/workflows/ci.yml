name: Calidad de Carva
on:
  workflow_dispatch:
  pull_request:
    branches: [main]
  push:
    branches: [main, 'codex/**']
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
      - name: Formato
        run: test -z "$(gofmt -l .)"
      - name: Tests y cobertura
        run: go test -count=1 -coverpkg=./internal/... -coverprofile=coverage.out ./...
      - name: Análisis estático
        run: go vet ./...
      - name: Build
        run: go build ./...
      - name: Frontend
        run: node --test tests/web/*.test.cjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: cobertura-go
          path: coverage.out
  deploy:
    name: Azure grupo10-carva
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    concurrency:
      group: azure-grupo10-carva
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Construir, publicar y desplegar demo
        shell: pwsh
        env:
          AZURE_CREDENTIALS: ${{ secrets.AZURE_CREDENTIALS }}
          ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
          CARVA_TEMPORARY_DATA: ${{ vars.CARVA_TEMPORARY_DATA }}
        run: ./scripts/deploy-azure.ps1 -ImageTag '${{ github.sha }}' -Build -TemporaryData:($env:CARVA_TEMPORARY_DATA -eq 'true')
